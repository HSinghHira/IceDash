<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{title}}</title>
<meta name="description" content="{{description}}">
<link rel="canonical" href="{{url}}">
<meta name="robots" content="{{robots}}">
<meta name="author" content="{{author}}">
<meta name="theme-color" content="#0b0d14">
<meta name="color-scheme" content="dark">
<meta name="application-name" content="{{site_name}}">
<meta name="apple-mobile-web-app-title" content="{{site_name}}">
<meta name="format-detection" content="telephone=no">
<meta property="og:type" content="website">
<meta property="og:site_name" content="{{site_name}}">
<meta property="og:locale" content="en_US">
<meta property="og:title" content="{{title}}">
<meta property="og:description" content="{{description}}">
<meta property="og:url" content="{{url}}">
<meta property="og:image" content="{{base_url}}img/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="The IceDash desktop">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{title}}">
<meta name="twitter:description" content="{{description}}">
<meta name="twitter:image" content="{{base_url}}img/og.png">
<meta name="twitter:image:alt" content="The IceDash desktop">
<link rel="icon" type="image/png" href="{{root}}favicon/favicon-96x96.png" sizes="96x96">
<link rel="icon" type="image/svg+xml" href="{{root}}favicon/favicon.svg">
<link rel="shortcut icon" href="{{root}}favicon/favicon.ico">
<link rel="apple-touch-icon" sizes="180x180" href="{{root}}favicon/apple-touch-icon.png">
<link rel="manifest" href="{{root}}manifest.webmanifest">
<script type="application/ld+json">{{{jsonld}}}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Unbounded:wght@800&text=IceDash&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{root}}css/style.css?v={{asset_v}}">
<script defer src="{{root}}js/icons.js?v={{asset_v}}"></script>
<script defer src="{{root}}js/site.js?v={{asset_v}}"></script>
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<div class="bg" aria-hidden="true"></div>
<div id="app">
{{{content}}}
<footer class="foot">
  <p class="m">Made with <span role="img" aria-label="love">🩵</span> by <a href="{{author_url}}">{{author}}</a> in New Zealand</p>
  <p>A community project, not affiliated with ZimaOS or CasaOS.</p>
  <p class="fl"><a href="{{icestore_url}}" aria-label="IceStore" title="IceStore">{{icon:package}}</a><a href="{{repo}}/releases" aria-label="Releases" title="Releases">{{icon:tag}}</a><a href="{{repo}}/issues" aria-label="Issues" title="Issues">{{icon:issues}}</a><a href="{{repo}}" aria-label="GitHub" title="GitHub">{{icon:github}}</a></p>
</footer>
</div>
</body>
</html>

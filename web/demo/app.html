<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>App</title>
<!-- What an app's window shows in IceDash's live demo: the demo has no apps
     running, so it says what the app is and where it would be. -->
<style>
  :root{color-scheme:dark}
  html,body{height:100%;margin:0}
  body{display:grid;place-items:center;padding:24px;box-sizing:border-box;background:#07090c;color:#fff;
    font:400 14px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;text-align:center}
  main{display:grid;justify-items:center;gap:12px;max-width:420px}
  img{width:72px;height:72px;border-radius:16px;background:rgba(255,255,255,.06)}
  h1{margin:4px 0 0;font-size:20px;font-weight:500}
  p{margin:0;color:rgba(255,255,255,.62)}
  .tag{color:rgba(255,255,255,.85)}
  a{margin-top:8px;color:#a5e8ff;text-decoration:none;border-bottom:1px solid rgba(76,201,240,.4)}
  a:hover{border-color:#a5e8ff}
</style>
</head>
<body>
<main>
  <img id="icon" alt="">
  <h1 id="title">App</h1>
  <p class="tag" id="tagline"></p>
  <p id="say">In the demo, apps don’t run. On your own server this app opens right here, in its window.</p>
  <a id="store" href="https://icestore.hsinghhira.me/" target="_blank" rel="noopener">See it in IceStore</a>
</main>
<script>
  const id = new URLSearchParams(location.search).get('app') || ''
  const store = 'https://icestore.hsinghhira.me'
  document.getElementById('icon').src = `${store}/apps/com.icestore.${id}/assets/icon.png`
  document.getElementById('store').href = `${store}/app/${encodeURIComponent(id)}/`
  fetch(`${store}/index.json`).then((r) => r.json()).then((idx) => {
    const a = idx.apps.find((x) => x.id === 'com.icestore.' + id)
    if (!a) return
    document.title = a.title
    document.getElementById('title').textContent = a.title
    document.getElementById('tagline').textContent = a.tagline
    document.getElementById('say').textContent = `In the demo, apps don’t run. On your own server ${a.title} opens right here, in its window.`
  }).catch(() => {})
</script>
</body>
</html>
